    <script>
      // Safeguard window.fetch descriptor against getter-only definitions in sandboxed iframes
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (
              (obj === window || obj === globalThis || (typeof window !== 'undefined' && obj === window.window)) &&
              prop === 'fetch' &&
              descriptor &&
              typeof descriptor === 'object'
            ) {
              var customGetter = descriptor.get;
              var customSetter = descriptor.set;
              var currentValue = descriptor.value;

              if (customGetter && !customSetter) {
                customSetter = function(val) {
                  currentValue = val;
                  customGetter = function() { return currentValue; };
                };
              }

              return origDefineProperty.call(this, obj, prop, {
                configurable: true,
                enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
                get: function() {
                  return customGetter ? customGetter.call(this) : currentValue;
                },
                set: function(val) {
                  if (customSetter) {
                    customSetter.call(this, val);
                  } else {
                    currentValue = val;
                  }
                }
              });
            }
            return origDefineProperty.apply(this, arguments);
          };
        } catch (e) {
          // Fallback ignore
        }
      })();
    </script>
    <script>
      // Retenção imediata do evento nativo 'beforeinstallprompt' antes da execução de qualquer framework
      window.__mfDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__mfDeferredPrompt = e;
        try {
          window.dispatchEvent(new CustomEvent('mf:beforeinstallprompt', { detail: e }));
        } catch (_) {}
      });
    </script>
