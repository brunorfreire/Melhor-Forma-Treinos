name: Deploy na Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Sem cache npm: o projeto tem bun.lock, não package-lock.json.

      - name: Validar configuracao segura do deploy
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          for var in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!var}" ]]; then
              echo "::error title=Configuracao ausente::Configure o secret $var no GitHub Actions antes de publicar."
              exit 1
            fi
          done
          if [[ "$VITE_SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error title=Supabase URL::VITE_SUPABASE_URL deve apontar para o projeto Supabase."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error title=Pasta de destino FTP::FTP_SERVER_DIR deve terminar com /."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Gerar build de produção
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy via FTP na Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
